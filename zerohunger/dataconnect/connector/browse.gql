query ListAvailableDonations @auth(level: USER_ANON) {
  donations(where: { statusId: { eq: 1 } }) {
    donationId
    donationTitle
    pickupTime
    itemQuantities
  }
}

query ListDonationStatuses @auth(level: USER_ANON) {
  donationStatuses {
    statusId
    name
  }
}

query ListDistributionEvents($asOf: Timestamp!) @auth(level: USER_ANON) {
  distributionEvents(
    where: { timeEnd: { gt: $asOf } }
    orderBy: { timeStart: ASC }
  ) {
    eventId
    eventType
    timeStart
    timeEnd
    location {
      street
      postalCode {
        code
        city
        province
      }
      organization {
        orgName
      }
    }
  }
}

query ListOrganizations @auth(level: USER_ANON) {
  organizations {
    orgId
    orgName
    orgPrimaryEmail
    street
    postalCode {
      code
      city
      province
    }
  }
}

query ListFoodCategories @auth(level: USER_ANON) {
  foodCategories {
    categoryId
    categoryName
    description
  }
}

query ListAllergens @auth(level: USER_ANON) {
  allergens {
    allergenId
    name
    description
  }
}

query ListMyActivity @auth(level: USER) {
  userActivities(
    where: { user: { authUid: { eq_expr: "auth.uid" } } }
    orderBy: { occurredAt: DESC }
  ) {
    activityId
    activityType
    occurredAt
    donation {
      donationTitle
      itemQuantities
      status {
        name
      }
    }
    event {
      eventType
    }
  }
}

query ListMyNotifications @auth(level: USER) {
  notifications(
    where: { user: { authUid: { eq_expr: "auth.uid" } } }
    orderBy: { createdAt: DESC }
    limit: 50
  ) {
    notificationId
    title
    content
    createdAt
    eventId
  }
}
